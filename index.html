<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Swing Baseball</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#101418; color:#e8edf2;
         padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom)); user-select:none; }
  button { font-size:16px; padding:11px 14px; border-radius:12px; border:0; background:#2d7ff9; color:#fff; width:100%; margin:5px 0; }
  button.alt { background:#2a323b; }
  .row { display:flex; gap:8px; align-items:stretch; }
  .card { background:#1a2027; border-radius:12px; padding:8px 10px; flex:1; text-align:center; }
  .card span { display:block; font-size:11px; color:#8b97a4; }
  .card b { font-size:20px; font-variant-numeric:tabular-nums; }
  canvas { width:100%; display:block; background:#1a2027; border-radius:12px; }
  #view { aspect-ratio: 4/3; margin:8px 0; }
  #msg { font-size:24px; font-weight:700; text-align:center; min-height:32px; margin:4px 0; }
  #sub { font-size:13px; color:#8b97a4; text-align:center; min-height:18px; }
  #dbg { font-size:12px; color:#8b97a4; line-height:1.5; margin-top:6px; }
  details { margin-top:8px; font-size:14px; }
  summary { color:#8b97a4; }
  label { display:block; margin:10px 0 2px; font-size:13px; color:#aab4bf; }
  input[type=range] { width:100%; }
  h1 { font-size:17px; margin:0 0 6px; }
</style>
</head>
<body>
<h1>⚾ Swing Baseball</h1>

<div class="row">
  <div class="card"><span>Inning</span><b id="inn">1/3</b></div>
  <div class="card"><span>Outs</span><b id="outs">0</b></div>
  <div class="card"><span>Count</span><b id="count">0-0</b></div>
  <div class="card"><span>Runs</span><b id="runs">0</b></div>
  <div class="card" style="flex:0 0 64px;padding:4px"><canvas id="dia" width="120" height="100" style="background:none"></canvas></div>
</div>

<canvas id="view" width="640" height="480"></canvas>
<div id="msg"></div>
<div id="sub">Tap a start button to begin.</div>

<div id="startBtns">
  <button id="startPhone">Start — phone swing (enables motion)</button>
  <button id="startDesk" class="alt">Start — desktop (click / Space to swing)</button>
  <button id="startClaude" class="alt">Start — Claude pitching (phone swing)</button>
</div>
<div class="row">
  <button id="pauseBtn" class="alt" style="display:none">Pause</button>
  <button id="newBtn" class="alt">New game</button>
</div>

<canvas id="field" width="640" height="300" style="margin-top:8px"></canvas>
<div id="dbg"></div>

<details id="linkBox">
  <summary>Claude link <span id="linkSt"></span></summary>
  <label>GitHub token (classic, gist scope) — paste once, stored on this device only</label>
  <input id="tok" type="password" autocomplete="off" placeholder="ghp_…" style="width:100%;padding:10px;border-radius:10px;border:0;background:#1a2027;color:#e8edf2;font-size:16px">
  <button id="tokSave" class="alt">Save &amp; test link</button>
  <button id="tokClear" class="alt">Forget token</button>
</details>

<details>
  <summary>Sound &amp; suspense</summary>
  <label><input type="checkbox" id="sndOn"> Sound effects</label>
  <label>Volume: <span id="volV">50</span>% (hard-capped by a limiter)</label>
  <input id="vol" type="range" min="0" max="80" step="5" value="50">
  <label><input type="checkbox" id="crowdOn"> Crowd cheers on the phone</label>
  <label><input type="checkbox" id="holdOn"> Suspense: hold the outcome of balls in play</label>
  <label><input type="checkbox" id="deskRev"> Claude mode: wait for the desktop reveal (up to 10 s)</label>
  <button id="sndTest" class="alt">Test sounds</button>
</details>

<details>
  <summary>Tuning</summary>
  <label>Contact offset: <span id="offV">0</span> ms (+ = treat swing as later)</label>
  <input id="off" type="range" min="-150" max="150" step="5" value="0">
  <label>Level tilt (beta°): <span id="lvlV">0</span> — small tweak; launch angle comes mostly from pitch height (low = lift)</label>
  <input id="lvl" type="range" min="-60" max="60" step="1" value="0">
  <label>Sensor rate: <span id="hz">–</span> Hz</label>
</details>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const rand = (a,b) => a + Math.random()*(b-a);
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const INNINGS = 3, GAP_MS = 2000, WINDUP_MS = 800;

  // ---------- persistence ----------
  const newGame = () => ({ inning:1, outs:0, balls:0, strikes:0, runs:0, hits:0, hr:0, bases:[0,0,0], over:false, ab:0, bestEV:0, innStart:0 });
  let G = newGame(), S = { off:0, lvl:0, best:0, vol:50, snd:true, crowd:false, hold:true, deskRev:false };
  try { const s = JSON.parse(localStorage.getItem('bbState')||'null'); if (s) { G = s.G||G; S = Object.assign(S, s.S||{}); } } catch(e) {}
  const save = () => { try { localStorage.setItem('bbState', JSON.stringify({G,S})); } catch(e) {} };

  // ---------- pitch types ----------
  const PITCHES = [
    { name:'Fastball',  ms:900,  mph:[92,99], bx:0,   w:4 },
    { name:'Changeup',  ms:1250, mph:[79,84], bx:0,   w:2 },
    { name:'Slider',    ms:1050, mph:[82,88], bx:60,  w:2 },
    { name:'Curveball', ms:1400, mph:[73,79], bx:-70, w:2 },
  ];
  function pickPitch() {
    let r = rand(0, PITCHES.reduce((a,p)=>a+p.w,0));
    for (const p of PITCHES) { if ((r -= p.w) < 0) return p; }
    return PITCHES[0];
  }
  function pickLocation() {            // zone is [-1,1] x [-1,1]
    if (Math.random() < 0.62) return { x:rand(-0.95,0.95), y:rand(-0.95,0.95) };
    const a = rand(0, Math.PI*2), r = rand(1.1, 1.6);
    return { x:Math.cos(a)*r, y:Math.sin(a)*r };
  }
  const inZone = l => Math.abs(l.x) <= 1 && Math.abs(l.y) <= 1;

  // ---------- game flow ----------
  let phase = 'idle';                  // idle | wait | windup | flight | result | over
  let pitch = null, timers = [], paused = false, sensorsOn = false, deskMode = false, splash = null;
  const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id; };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

  // Claude mode: pitches requested through a secret gist (see "Claude link" section below)
  let claudeMode = false, awaiting = false, pendingSpec = null, evts = [], lastSwing = null;

  // While a ball in play is being "held" for suspense, text/scoreboard/field output is buffered until endHold().
  let holding = false, holdMs = 0, revealTimer = null, held = {}, lastRes = null;
  function paintMsg(t, color) { $('msg').textContent = t; $('msg').style.color = color || '#e8edf2'; }
  function paintSub(t) { $('sub').textContent = t; }
  function setMsg(t, color) { if (t) evts.push(t); if (holding) { held.msg = [t, color]; return; } paintMsg(t, color); }
  function setSub(t) { if (holding) { held.sub = t; return; } paintSub(t); }
  function setDbg(t) { if (holding) { held.dbg = t; return; } $('dbg').textContent = t; }

  function render() {
    if (holding) return;
    $('inn').textContent = `${Math.min(G.inning, INNINGS)}/${INNINGS}`;
    $('outs').textContent = G.outs;
    $('count').textContent = `${G.balls}-${G.strikes}`;
    $('runs').textContent = G.runs;
    drawDiamond();
  }

  function scheduleNextPitch(gap) {
    if (G.over) { splash = null; endGame(); return; }
    phase = 'wait';
    if (splash) {                       // "next inning" splash after the result has had a moment to read
      const s = splash; splash = null;
      later(() => {
        SFX.play('inning');
        setMsg(`End of inning ${s.n}`, '#8bb8ff');
        setSub(`${s.runs} run${s.runs === 1 ? '' : 's'} this inning · up next: inning ${s.n + 1}/${INNINGS}`);
      }, 1200);
      gap = Math.max(gap, 3400);
    }
    later(() => {
      if (paused) { phase = 'idle'; return; }
      if (claudeMode) { awaiting = true; setMsg(''); setSub('Waiting for Claude’s pitch…'); tryRequested(); return; }
      startWindup(null);
    }, gap);
  }

  function startWindup(spec) {
    awaiting = false;
    phase = 'windup'; setMsg('Get ready…'); setSub('');
    if (navigator.vibrate) navigator.vibrate(15);
    SFX.play('windup');
    later(() => throwPitch(spec), WINDUP_MS);
  }
  function tryRequested() {
    if (claudeMode && awaiting && !paused && pendingSpec) { const s = pendingSpec; pendingSpec = null; startWindup(s); }
  }

  function throwPitch(spec) {
    spec = spec || {};
    const type = PITCHES.find(p => p.name.toLowerCase() === String(spec.type || '').toLowerCase()) || pickPitch();
    const loc = (isFinite(spec.x) && isFinite(spec.y)) ? { x:clamp(+spec.x, -1.8, 1.8), y:clamp(+spec.y, -1.8, 1.8) } : pickLocation();
    const now = performance.now();
    const mph = isFinite(spec.mph) ? clamp(Math.round(+spec.mph), 60, 105) : Math.round(rand(type.mph[0], type.mph[1]));
    pitch = { type, loc, strike:inZone(loc), t0:now, at:now + type.ms, mph, resolved:false, reqId:spec.id || 0, spec };
    evts = []; lastSwing = null;
    const mine = pitch;
    later(() => { if (pitch === mine && !mine.resolved && !swing) SFX.play('mitt'); }, type.ms);   // catcher's mitt on a take
    phase = 'flight'; setMsg('');
    setSub(`${type.name} ${pitch.mph} mph`);
    // if no swing is in progress shortly after arrival, it's a take
    later(() => { if (pitch && !pitch.resolved && !swing) resolveTake(); }, type.ms + 260);
    later(() => { if (pitch && !pitch.resolved) resolveTake(); }, type.ms + 900);   // safety net
  }

  function resolveTake() {
    const p = pitch; p.resolved = true;
    if (p.strike) { setMsg('Called strike', '#ffb340'); SFX.play('ump_strike'); addStrike(false); }
    else { setMsg('Ball', '#8bb8ff'); SFX.play('ump_ball'); addBall(); }
    finishPitch();
  }

  function addStrike(foul) {
    if (foul && G.strikes >= 2) return;
    G.strikes++;
    if (G.strikes >= 3) { setMsg('STRIKEOUT', '#ff6b6b'); SFX.play('ump_out'); addOut(); }
  }
  function addBall() {
    G.balls++;
    if (G.balls >= 4) {
      setMsg('WALK', '#3ddc84');
      const b = G.bases;
      if (b[0]) { if (b[1]) { if (b[2]) G.runs++; b[2] = 1; } b[1] = 1; }
      b[0] = 1; resetCount();
    }
  }
  function resetCount() { G.balls = 0; G.strikes = 0; }
  function addOut() {
    G.outs++; resetCount();
    if (G.outs >= 3) {
      splash = { n: G.inning, runs: G.runs - (G.innStart || 0) };
      G.innStart = G.runs;
      G.outs = 0; G.bases = [0,0,0]; G.inning++;
      if (G.inning > INNINGS) G.over = true;
    }
  }
  function advance(n) {                 // n = bases for batter (4 = HR)
    const nb = [0,0,0];
    G.bases.forEach((on, i) => { if (on) { const j = i + n; if (j >= 3) G.runs++; else nb[j] = 1; } });
    if (n >= 4) G.runs++; else nb[n-1] = 1;
    G.bases = nb; resetCount();
  }

  function finishPitch() {
    save(); render();
    pitch.resolved = true;
    if (claudeMode && pitch.reqId) reportResult();
    phase = 'result';
    if (holding) revealTimer = setTimeout(() => endHold(false), holdMs);
    else scheduleNextPitch(GAP_MS);
  }

  // ---- suspense hold for balls in play ----
  function beginHold(out) {
    holding = true; held = { out };
    holdMs = (claudeMode && S.deskRev) ? 10000 : clamp(1100 + Math.min(out.dist, 450) * 3, 1200, 2600);
    paintMsg('In play…', '#8bb8ff'); paintSub('');
  }
  function endHold(silent) {
    if (!holding) return;
    holding = false; clearTimeout(revealTimer); revealTimer = null;
    render();
    if (!silent) {
      if (held.ball) drawField(...held.ball);
      if (held.dbg != null) $('dbg').textContent = held.dbg;
      if (held.msg) paintMsg(...held.msg);
      if (held.sub != null) paintSub(held.sub);
      const o = held.out || {};
      if (o.kind === 'out') SFX.play('catch');
      else if (o.kind === 'hit' && o.bases === 4) SFX.play('cheer', { crowd:true });
    }
    held = {};
    if (claudeMode && pitch && pitch.reqId && lastRes && lastRes.id === pitch.reqId && lastRes.hold)
      queueWrite(Object.assign({}, lastRes, { hold:false, revealed:true, ts:Date.now() }));
    if (!silent) scheduleNextPitch(GAP_MS);
  }

  function endGame() {
    phase = 'over';
    if (G.runs > S.best) S.best = G.runs;
    save();
    setMsg(`Game over: ${G.runs} run${G.runs===1?'':'s'}`, '#3ddc84');
    setSub(`${G.hits} hits, ${G.hr} HR, best exit velo ${G.bestEV} mph. Best game: ${S.best} runs.`);
    $('pauseBtn').style.display = 'none';
  }

  // ---------- swing -> batted ball ----------
  function resolveSwing(sw) {
    const p = pitch; p.resolved = true;
    const d = Math.round(sw.peakT + S.off - p.at);         // ms; negative = early
    const chase = p.strike ? 0 : clamp((Math.max(Math.abs(p.loc.x), Math.abs(p.loc.y)) - 1) / 0.6, 0, 1);
    const ad = Math.abs(d);
    let q = ad <= 30 ? 1 : ad <= 60 ? 0.8 : ad <= 95 ? 0.55 : ad <= 130 ? 0.3 : 0;
    q *= (1 - 0.45*chase);

    // bat speed 0..1.2 from spin + accel
    const sp = clamp((sw.gpeak - 400) / 700, 0, 1.2), ac = clamp((sw.peak - 25) / 50, 0, 1.2);
    const bat = 0.6*sp + 0.4*ac;

    const dbg = `timing ${d>0?'+':''}${d} ms · bat ${bat.toFixed(2)} · tilt ${Math.round(sw.beta)}°`;
    lastSwing = { timing:d, bat:+bat.toFixed(2) };
    if (ad > 130 || (chase > 0.4 && Math.random() < 0.6)) {
      setMsg(d < 0 ? 'Swing and a miss (early)' : 'Swing and a miss (late)', '#ffb340');
      setDbg(dbg); SFX.play('whiff'); later(() => SFX.play('mitt', { gain:0.8 }), 150);
      addStrike(false); finishPitch(); return;
    }
    if (q <= 0.3 && Math.random() < 0.7) {                 // weak contact -> foul
      setMsg('Foul ball', '#ffb340'); setDbg(dbg); SFX.play('foul');
      addStrike(true); finishPitch(); return;
    }

    const ev = Math.round((48 + 66*bat) * (0.6 + 0.4*q) + (p.mph - 80) * 0.2);
    const la = clamp(14 + p.loc.y * 12 + (sw.beta - S.lvl) * 0.3 + rand(-6,6), -20, 70);   // low pitch (y>0) = lifted
    const spray = clamp(d * 0.35 + rand(-7,7), -70, 70);   // negative = pull side (left, righty)
    const out = classifyHit(ev, la, spray, p);
    G.bestEV = Math.max(G.bestEV, ev);
    Object.assign(lastSwing, { ev, la:Math.round(la), spray:Math.round(spray), dist:out.dist });
    SFX.play(out.kind === 'foul' ? 'foul' : ev >= 100 ? 'crack_barrel' : ev >= 85 ? 'crack_solid' : 'crack_weak');
    if (out.kind !== 'foul' && S.hold) beginHold(out);
    setDbg(`${dbg} · exit ${ev} mph · launch ${Math.round(la)}° · spray ${Math.round(spray)}° · ${out.dist} ft`);
    drawField(spray, out.dist, out.kind, la);

    if (out.kind === 'foul') { setMsg('Foul ball', '#ffb340'); addStrike(true); }
    else if (out.kind === 'out') { setMsg(out.text, '#ff6b6b'); outCase(out); }
    else {
      G.hits++;
      if (out.bases === 4) G.hr++;
      advance(out.bases);
      setMsg(out.text, '#3ddc84');
    }
    setSub(`${p.type.name} ${p.mph} mph · ${ev} mph exit velo`);
    finishPitch();
  }

  function outCase(o) {
    const g = o.gb && G.bases[0] && G.outs < 2 && Math.random() < 0.3;
    if (g) { setMsg('Double play', '#ff6b6b'); G.bases[0] = 0; addOut(); if (!G.over && G.outs !== 0) addOut(); return; }
    if (!o.gb && G.bases[2] && G.outs < 2 && o.dist > 200) { G.bases[2] = 0; G.runs++; setMsg('Sacrifice fly', '#3ddc84'); }
    addOut();
  }

  function classifyHit(ev, la, spray, p) {
    const dist = Math.round(Math.pow(ev*0.447, 2) * Math.sin(2*clamp(la,0,90)*Math.PI/180) / 9.8 * 0.72 * 3.28);
    if (Math.abs(spray) > 45) return { kind:'foul', dist };
    const fence = 375 - 55 * Math.abs(spray)/45;
    if (la < 10) {                                       // ground ball / low liner
      const pr = clamp(0.12 + 0.5*(ev-55)/45, 0.08, 0.6);
      const gd = Math.round(120 + ev*0.9);
      if (Math.random() < pr) return { kind:'hit', bases:1, text:'Ground ball single', dist:gd };
      return { kind:'out', gb:true, text:'Groundout', dist:gd };
    }
    if (la < 25) {                                       // line drive
      if (dist >= fence && la > 15) return { kind:'hit', bases:4, text:'HOME RUN', dist };
      if (Math.random() < 0.72) return Math.random() < 0.28 && ev > 92
        ? { kind:'hit', bases:2, text:'Double', dist } : { kind:'hit', bases:1, text:'Line drive single', dist };
      return { kind:'out', text:'Lineout', dist };
    }
    if (la < 52) {                                       // fly ball
      if (dist >= fence) return { kind:'hit', bases:4, text:'HOME RUN', dist };
      if (dist > 190 && Math.random() < 0.4) return { kind:'hit', bases:Math.random()<0.4?2:1, text:'Fly ball falls in', dist };
      return { kind:'out', text:'Flyout', dist };
    }
    return { kind:'out', text:'Popup', dist: Math.round(dist*0.5) };
  }

  // ---------- sensors / swing detection ----------
  const START_T = 12, END_T = 6;
  let lastEv = 0, rateEMA = 0, grav = {x:0,y:0,z:0}, mag = 0, gyro = 0, orient = {beta:0,gamma:0};
  let swing = null, cooldownUntil = 0, wakeLock = null;

  function onMotion(e) {
    const now = performance.now();
    if (lastEv) { const dt = now - lastEv; if (dt > 0) rateEMA = rateEMA ? rateEMA*0.95 + (1000/dt)*0.05 : 1000/dt; }
    lastEv = now;
    let ax, ay, az;
    const a = e.acceleration;
    if (a && a.x !== null && a.x !== undefined) { ax=a.x; ay=a.y; az=a.z; }
    else if (e.accelerationIncludingGravity) {
      const g = e.accelerationIncludingGravity, k = 0.9;
      grav.x = k*grav.x + (1-k)*g.x; grav.y = k*grav.y + (1-k)*g.y; grav.z = k*grav.z + (1-k)*g.z;
      ax=g.x-grav.x; ay=g.y-grav.y; az=g.z-grav.z;
    } else return;
    mag = Math.hypot(ax, ay, az);
    const r = e.rotationRate;
    gyro = r ? Math.hypot(r.alpha||0, r.beta||0, r.gamma||0) : 0;

    if (!swing && mag > START_T && now > cooldownUntil) {
      swing = { t0:now, peak:mag, peakT:now, gpeak:gyro, beta:orient.beta, lastHigh:now };
    } else if (swing) {
      if (mag > swing.peak) { swing.peak = mag; swing.peakT = now; swing.beta = orient.beta; }
      if (gyro > swing.gpeak) swing.gpeak = gyro;
      if (mag > END_T) swing.lastHigh = now;
      if (now - swing.lastHigh > 80 || now - swing.t0 > 600) finishSwing(now);
    }
  }
  function onOrient(e) { orient.beta = e.beta || 0; orient.gamma = e.gamma || 0; }

  function finishSwing(now) {
    const s = swing; swing = null; cooldownUntil = now + 700;
    if (navigator.vibrate) navigator.vibrate(25);
    handleSwing(s);
  }
  function handleSwing(s) {
    if (paused) return;
    // only swings that overlap a live pitch count; anything else is a practice swing
    if (phase === 'flight' && pitch && !pitch.resolved && s.peakT > pitch.t0 + 150) resolveSwing(s);
    else if (phase !== 'result' && phase !== 'over') setSub(`Practice swing — ${Math.round(s.gpeak)}°/s`);
  }

  // desktop synthetic swing
  function deskSwing() {
    if (!deskMode) return;
    handleSwing({ peakT:performance.now(), peak:rand(45,70), gpeak:rand(700,1050), beta:rand(10,35) });
  }

  // ---------- start / pause / new ----------
  async function begin(mode) {
    SFX.init();
    if (mode === 'claude' && !TOKEN) { setSub('Open “Claude link” below and paste your token first.'); $('linkBox').open = true; return; }
    claudeMode = (mode === 'claude');
    if (mode === 'phone' || mode === 'claude') {
      try {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          const p = await DeviceMotionEvent.requestPermission();
          if (p !== 'granted') { setSub('Motion permission denied.'); return; }
          if (typeof DeviceOrientationEvent.requestPermission === 'function') { try { await DeviceOrientationEvent.requestPermission(); } catch(e) {} }
        }
      } catch (err) { setSub('Permission error: ' + err); return; }
      if (!sensorsOn) {
        window.addEventListener('devicemotion', onMotion);
        window.addEventListener('deviceorientation', onOrient);
        sensorsOn = true;
      }
      try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
      setTimeout(() => { if (!lastEv) setSub('No sensor data. Needs HTTPS and a phone with motion sensors.'); }, 2500);
    } else { deskMode = true; }
    $('startBtns').style.display = 'none';
    $('pauseBtn').style.display = 'block';
    if (G.over) G = newGame();
    render(); setMsg('Play ball!');
    clearTimers(); scheduleNextPitch(1200);
    if (claudeMode) startPolling(); else stopPolling();
  }

  $('startPhone').onclick = () => begin('phone');
  $('startClaude').onclick = () => begin('claude');
  $('startDesk').onclick = () => begin('desk');
  $('pauseBtn').onclick = () => {
    paused = !paused;
    $('pauseBtn').textContent = paused ? 'Resume' : 'Pause';
    if (paused) { endHold(true); requeueUnresolved(); clearTimers(); setMsg('Paused'); phase = 'idle'; pitch = null; awaiting = false; }
    else { setMsg(''); scheduleNextPitch(800); }
  };
  $('newBtn').onclick = () => {
    endHold(true); requeueUnresolved(); clearTimers(); paused = false; pitch = null; awaiting = false; G = newGame(); save(); render();
    $('pauseBtn').textContent = 'Pause'; $('dbg').textContent = ''; drawField(null);
    if (sensorsOn || deskMode) { $('pauseBtn').style.display = 'block'; setMsg('Play ball!'); scheduleNextPitch(1200); }
    else { setMsg(''); setSub('Tap a start button to begin.'); }
  };
  document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); deskSwing(); } });
  $('view').addEventListener('click', () => { if (deskMode && !sensorsOn) deskSwing(); });
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && sensorsOn && navigator.wakeLock) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {} }
  });

  // ---------- Claude link (secret gist as a message bus) ----------
  // request.json  <- desktop MCP writes {id, type, x, y, mph}   (id = increasing number)
  // result.json   <- this page writes {id, ...result}           (id = the request it answers)
  const GIST_ID = '0e74fa52811bb637e3f7b03e423fce90', API = 'https://api.github.com/gists/' + GIST_ID;
  let TOKEN = ''; try { TOKEN = localStorage.getItem('bbToken') || ''; } catch(e) {}
  let pollTimer = null, etag = null, lastResultId = 0, polling = false;
  const linkSt = t => { $('linkSt').textContent = t ? '· ' + t : ''; };
  const hdrs = extra => Object.assign({ Authorization:'Bearer ' + TOKEN, Accept:'application/vnd.github+json' }, extra || {});
  linkSt(TOKEN ? 'token saved' : 'no token');

  async function pollOnce() {
    if (polling || !TOKEN || document.visibilityState !== 'visible') return;
    polling = true;
    try {
      const r = await fetch(API, { headers: hdrs(etag ? { 'If-None-Match': etag } : {}) });
      if (r.status === 304) { linkSt('connected'); return; }
      if (!r.ok) { linkSt('error ' + r.status); return; }
      etag = r.headers.get('ETag');
      const j = await r.json(), f = j.files || {};
      const req = JSON.parse((f['request.json'] || {}).content || '{}');
      const res = JSON.parse((f['result.json'] || {}).content || '{}');
      lastResultId = Math.max(lastResultId, res.id || 0);
      linkSt('connected');
      const rev = JSON.parse((f['reveal.json'] || {}).content || '{}');   // written by the desktop sim when its replay ends
      if (holding && S.deskRev && rev.id && pitch && rev.id === pitch.reqId) endHold(false);
      const seen = Math.max(S.lastReq || 0, lastResultId, pendingSpec ? pendingSpec.id : 0, pitch && pitch.reqId || 0);
      if (req.id && req.id > seen) { pendingSpec = req; S.lastReq = req.id; save(); tryRequested(); }
    } catch (e) { linkSt('offline'); }
    finally { polling = false; }
  }
  function startPolling() { stopPolling(); etag = null; pollOnce().then(postStatus); pollTimer = setInterval(pollOnce, 2000); }
  // a pitch that was thrown but never resolved (pause / new game) goes back in the queue
  function requeueUnresolved() { if (claudeMode && pitch && pitch.reqId && !pitch.resolved) pendingSpec = pitch.spec; }
  function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && claudeMode) { etag = null; pollOnce(); } });

  function stateSnap() {
    return { inning:Math.min(G.inning, INNINGS), innings:INNINGS, outs:G.outs, balls:G.balls, strikes:G.strikes,
             runs:G.runs, bases:G.bases.slice(), over:G.over, hits:G.hits, hr:G.hr };
  }
  let wq = Promise.resolve();
  const queueWrite = obj => { wq = wq.then(() => writeResult(obj)).catch(() => {}); return wq; };
  async function writeResult(obj) {
    for (let i = 0; i < 3; i++) {
      try {
        const r = await fetch(API, { method:'PATCH', headers: hdrs({ 'Content-Type':'application/json' }),
          body: JSON.stringify({ files: { 'result.json': { content: JSON.stringify(obj) } } }) });
        if (r.ok) { etag = null; return true; }
      } catch (e) {}
      await new Promise(r => setTimeout(r, 700 * (i + 1)));
    }
    linkSt('write failed'); return false;
  }
  function postStatus() { queueWrite({ id: lastResultId, ready:true, ts:Date.now(), state:stateSnap() }); }
  function reportResult() {
    const p = pitch, loc = p.loc;
    const res = {
      id: p.reqId, ts: Date.now(),
      pitch: { type:p.type.name, mph:p.mph, x:+loc.x.toFixed(2), y:+loc.y.toFixed(2), strike:p.strike },
      swung: !!lastSwing, swing: lastSwing || null,
      events: evts.filter(Boolean).slice(), state: stateSnap(), hold: holding,
    };
    lastResultId = Math.max(lastResultId, p.reqId);
    lastRes = res; queueWrite(res);
  }

  $('tokSave').onclick = async () => {
    const t = $('tok').value.trim(); if (!t) return;
    TOKEN = t; try { localStorage.setItem('bbToken', t); } catch(e) {}
    $('tok').value = ''; etag = null; linkSt('testing…');
    try {
      const r = await fetch(API, { headers: hdrs() });
      linkSt(r.ok ? 'connected' : r.status === 401 ? 'bad token' : 'error ' + r.status);
    } catch (e) { linkSt('offline'); }
  };
  $('tokClear').onclick = () => { TOKEN = ''; try { localStorage.removeItem('bbToken'); } catch(e) {} stopPolling(); linkSt('no token'); };

  // ---------- sound (Web Audio; synthesized placeholders, real files override by name) ----------
  // Put files in sfx/ and list them in sfx/manifest.json, e.g. {"crack_solid":"crack_solid.mp3"}.
  // Names: crack_weak crack_solid crack_barrel whiff mitt foul catch windup inning cheer ump_strike ump_ball ump_out
  // Everything goes through master gain -> compressor -> soft clipper, so nothing can spike.
  const SFX = (() => {
    let ctx = null, master = null, noise = null; const buffers = {}, gains = {}, synth = {};
    const vol = () => S.snd === false ? 0 : clamp((S.vol || 0) / 100, 0, 0.8);
    function init() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      try { ctx = new AC(); } catch (e) { return; }
      master = ctx.createGain(); master.gain.value = vol();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -18; comp.knee.value = 0; comp.ratio.value = 20; comp.attack.value = 0.002; comp.release.value = 0.12;
      const clip = ctx.createWaveShaper(), n = 1024, c = new Float32Array(n);
      for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; c[i] = 0.85 * Math.tanh(1.2 * x) / Math.tanh(1.2); }
      clip.curve = c;
      master.connect(comp); comp.connect(clip); clip.connect(ctx.destination);
      noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      loadFiles();
    }
    async function loadFiles() {
      try {
        const m = await (await fetch('sfx/manifest.json', { cache:'no-cache' })).json();
        for (const [name, v] of Object.entries(m)) {         // value: "file.ogg" or {"file":"file.ogg","gain":2}
          const file = typeof v === 'string' ? v : v.file;
          try { const ab = await (await fetch('sfx/' + file)).arrayBuffer(); buffers[name] = await ctx.decodeAudioData(ab); gains[name] = (v && v.gain) || 1; } catch (e) {}
        }
      } catch (e) {}
    }
    const setVol = () => { if (master) master.gain.value = vol(); };
    const burst = (g, t, o) => {
      const s = ctx.createBufferSource(); s.buffer = noise; s.loop = true;
      const f = ctx.createBiquadFilter(); f.type = o.type || 'bandpass'; f.frequency.setValueAtTime(o.freq, t); f.Q.value = o.q || 1;
      if (o.sweepTo) f.frequency.exponentialRampToValueAtTime(o.sweepTo, t + o.dur);
      const a = ctx.createGain(), att = o.att || 0.004;
      a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(o.gain, t + att); a.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      s.connect(f); f.connect(a); a.connect(g); s.start(t); s.stop(t + o.dur + 0.02);
    };
    const tone = (g, t, o) => {
      const osc = ctx.createOscillator(); osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(o.freq, t);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
      const a = ctx.createGain(); a.gain.setValueAtTime(o.gain, t); a.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      osc.connect(a); a.connect(g); osc.start(t); osc.stop(t + o.dur + 0.02);
    };
    synth.crack_weak   = (g, t) => { burst(g, t, { dur:.05, freq:1400, q:.8, gain:.5 }); tone(g, t, { freq:150, to:70, dur:.07, gain:.4 }); };
    synth.crack_solid  = (g, t) => { burst(g, t, { dur:.07, freq:2200, q:.9, gain:.8 }); tone(g, t, { freq:190, to:60, dur:.10, gain:.7 }); };
    synth.crack_barrel = (g, t) => { burst(g, t, { dur:.09, freq:2600, q:1, gain:1 }); tone(g, t, { freq:210, to:55, dur:.13, gain:.9 }); tone(g, t, { freq:1250, dur:.16, gain:.25 }); };
    synth.whiff  = (g, t) => burst(g, t, { dur:.22, freq:500, sweepTo:2600, q:1.2, gain:.45 });
    synth.mitt   = (g, t) => { burst(g, t, { dur:.07, type:'lowpass', freq:900, gain:.9 }); tone(g, t, { freq:140, to:60, dur:.09, gain:.6 }); };
    synth.foul   = (g, t) => burst(g, t, { dur:.03, freq:3200, q:2, gain:.4 });
    synth.catch  = (g, t) => burst(g, t, { dur:.12, type:'lowpass', freq:600, gain:.6 });
    synth.windup = (g, t) => { tone(g, t, { freq:660, dur:.09, gain:.25, type:'triangle' }); tone(g, t + .11, { freq:880, dur:.09, gain:.25, type:'triangle' }); };
    synth.inning = (g, t) => [523, 659, 784, 1047].forEach((f, i) => tone(g, t + i * .13, { freq:f, dur:.14, gain:.15, type:'square' }));
    synth.cheer  = (g, t) => burst(g, t, { dur:1.6, freq:1200, q:.4, gain:.5, att:.35 });
    function play(name, o) {
      o = o || {};
      if (!ctx || S.snd === false || (o.crowd && !S.crowd)) return;
      const g = ctx.createGain(); g.gain.value = (o.gain == null ? 1 : o.gain) * (buffers[name] ? gains[name] : 1); g.connect(master);
      if (buffers[name]) { const s = ctx.createBufferSource(); s.buffer = buffers[name]; s.connect(g); s.start(); return; }
      if (synth[name]) synth[name](g, ctx.currentTime);
    }
    function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
    return { init, play, setVol, resume, loaded: () => Object.keys(buffers) };
  })();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') SFX.resume(); });

  $('sndOn').checked = S.snd !== false; $('crowdOn').checked = !!S.crowd; $('holdOn').checked = S.hold !== false; $('deskRev').checked = !!S.deskRev;
  $('vol').value = S.vol; $('volV').textContent = S.vol;
  $('sndOn').onchange = e => { S.snd = e.target.checked; SFX.setVol(); save(); };
  $('crowdOn').onchange = e => { S.crowd = e.target.checked; save(); };
  $('holdOn').onchange = e => { S.hold = e.target.checked; save(); };
  $('deskRev').onchange = e => { S.deskRev = e.target.checked; save(); };
  $('vol').oninput = e => { S.vol = +e.target.value; $('volV').textContent = S.vol; SFX.setVol(); save(); };
  $('sndTest').onclick = () => {
    SFX.init();
    [['crack_weak', 0], ['crack_solid', 450], ['crack_barrel', 900], ['whiff', 1500], ['mitt', 1900], ['foul', 2300], ['catch', 2700], ['windup', 3100], ['inning', 3600], ['cheer', 4300]]
      .forEach(([n, t]) => setTimeout(() => SFX.play(n, n === 'cheer' ? { crowd:false } : {}), t));
  };

  // ---------- tuning ----------
  $('off').value = S.off; $('offV').textContent = S.off;
  $('lvl').value = S.lvl; $('lvlV').textContent = S.lvl;
  $('off').oninput = e => { S.off = +e.target.value; $('offV').textContent = S.off; save(); };
  $('lvl').oninput = e => { S.lvl = +e.target.value; $('lvlV').textContent = S.lvl; save(); };

  // ---------- drawing ----------
  const vc = $('view'), vx = vc.getContext('2d');
  function drawView() {
    const W = vc.width, H = vc.height, zw = 170, zh = 210, cx = W/2, cy = H*0.68;
    vx.clearRect(0,0,W,H);
    // sky/grass
    vx.fillStyle = '#17301f'; vx.fillRect(0, H*0.38, W, H*0.62);
    // strike zone
    vx.strokeStyle = 'rgba(255,255,255,0.5)'; vx.lineWidth = 2;
    vx.strokeRect(cx - zw/2, cy - zh/2, zw, zh);
    // plate
    vx.fillStyle = '#ddd'; vx.beginPath();
    vx.moveTo(cx-60, cy+zh/2+22); vx.lineTo(cx+60, cy+zh/2+22); vx.lineTo(cx+60, cy+zh/2+34);
    vx.lineTo(cx, cy+zh/2+50); vx.lineTo(cx-60, cy+zh/2+34); vx.fill();
    if (phase === 'flight' && pitch) {
      const now = performance.now();
      const p = clamp((now - pitch.t0) / pitch.type.ms, 0, 1.25);
      const x0 = cx, y0 = H*0.30;
      const tx = cx + pitch.loc.x * zw/2, ty = cy + pitch.loc.y * zh/2;
      const q = Math.min(p, 1.25), lin = Math.min(p,1);
      const e = Math.pow(lin, 1.7);
      const x = x0 + (tx - x0)*e + pitch.type.bx * (1-lin) * lin * 1.2;
      const y = y0 + (ty - y0)*e;
      const r = 5 + 24*Math.pow(q, 2.2);
      vx.fillStyle = '#f4f4f4'; vx.beginPath(); vx.arc(x, y, r, 0, 7); vx.fill();
      vx.strokeStyle = '#d33'; vx.lineWidth = 1.5; vx.beginPath(); vx.arc(x, y, r*0.7, 0.4, 1.9); vx.stroke();

      // shrinking ring: closes onto the strike zone at arrival
      const sc = 1 + 1.3*(1 - lin);
      vx.strokeStyle = `rgba(255,210,74,${0.25 + 0.6*lin})`; vx.lineWidth = 3;
      vx.strokeRect(cx - zw*sc/2, cy - zh*sc/2, zw*sc, zh*sc);

      // timing bar: cursor sweeps right; coloured windows = where a swing PEAK scores
      const bx = 40, bw = W - 80, by = H - 30, bh = 16, total = pitch.type.ms + 250;
      const fx = ms => bx + bw * clamp(ms / total, 0, 1);
      const c = pitch.type.ms - S.off;                       // window centre (ms after release)
      vx.fillStyle = '#10161c'; vx.fillRect(bx, by, bw, bh);
      [[130,'#3a3118'],[95,'#5a4a1e'],[60,'#8a6d1c'],[30,'#3ddc84']].forEach(([hw,col]) => {
        vx.fillStyle = col; vx.fillRect(fx(c-hw), by, fx(c+hw)-fx(c-hw), bh);
      });
      const cur = fx(now - pitch.t0);
      vx.fillStyle = '#fff'; vx.fillRect(cur - 2, by - 5, 4, bh + 10);
      vx.strokeStyle = '#33404c'; vx.lineWidth = 1; vx.strokeRect(bx, by, bw, bh);
    }
    requestAnimationFrame(drawView);
  }

  const dc = $('dia'), dx = dc.getContext('2d');
  function drawDiamond() {
    dx.clearRect(0,0,120,100);
    const pts = [[88,50],[60,22],[32,50]];       // 1st, 2nd, 3rd
    pts.forEach((p,i) => {
      dx.save(); dx.translate(p[0],p[1]); dx.rotate(Math.PI/4);
      dx.fillStyle = G.bases[i] ? '#ffd24a' : '#2a323b'; dx.fillRect(-9,-9,18,18); dx.restore();
    });
    dx.save(); dx.translate(60,78); dx.rotate(Math.PI/4); dx.fillStyle = '#556'; dx.fillRect(-7,-7,14,14); dx.restore();
  }

  const fc = $('field'), fx = fc.getContext('2d');
  let ball = null;                                  // {t0,dur,spray,dist,kind,la}
  const FENCE = a => 375 - 55*Math.abs(a)/45;
  function drawField(spray, dist, kind, la) {
    if (holding && spray !== null && spray !== undefined) { held.ball = [spray, dist, kind, la]; return; }
    ball = (spray === null || spray === undefined) ? null
         : { t0: performance.now(), spray, dist, kind, la: la || 0,
             dur: clamp(600 + Math.min(dist,450)*2.2, 800, 1700) };
  }
  function fieldLoop() {
    const W = fc.width, H = fc.height, hx = W/2, hy = H - 14, sc = (H - 30) / 420;
    fx.clearRect(0,0,W,H);
    fx.strokeStyle = '#33404c'; fx.lineWidth = 2;
    fx.beginPath(); fx.moveTo(hx, hy); fx.lineTo(hx - Math.sin(Math.PI/4)*420*sc, hy - Math.cos(Math.PI/4)*420*sc);
    fx.moveTo(hx, hy); fx.lineTo(hx + Math.sin(Math.PI/4)*420*sc, hy - Math.cos(Math.PI/4)*420*sc); fx.stroke();
    fx.strokeStyle = '#4a5a6a'; fx.beginPath();
    for (let a = -45; a <= 45; a += 3) {
      const r = FENCE(a) * sc, rad = a*Math.PI/180;
      const x = hx + Math.sin(rad)*r, y = hy - Math.cos(rad)*r;
      a === -45 ? fx.moveTo(x,y) : fx.lineTo(x,y);
    }
    fx.stroke();
    if (ball) {
      const f = clamp((performance.now() - ball.t0) / ball.dur, 0, 1);
      const rad = ball.spray*Math.PI/180, total = Math.min(ball.dist, 470) * sc;
      const col = ball.kind === 'hit' ? '#3ddc84' : ball.kind === 'foul' ? '#ffb340' : '#ff6b6b';
      // ground position advances ~linearly; height is an arc (grounders skip along the dirt)
      const d = total * (ball.la < 10 ? f : 1 - Math.pow(1 - f, 1.4));
      const gx = hx + Math.sin(rad)*d, gy = hy - Math.cos(rad)*d;
      const apex = ball.la < 10 ? 0 : clamp(ball.la / 70, 0.15, 1) * 110;
      const h = ball.la < 10 ? Math.abs(Math.sin(f*Math.PI*3)) * 7 * (1 - f) : Math.sin(f*Math.PI) * apex;
      if (f < 1) {
        fx.fillStyle = 'rgba(0,0,0,0.45)'; fx.beginPath(); fx.ellipse(gx, gy, 6, 3, 0, 0, 7); fx.fill();   // shadow
        fx.fillStyle = '#f4f4f4'; fx.beginPath(); fx.arc(gx, gy - h, 6 + h/40, 0, 7); fx.fill();
      } else {
        fx.fillStyle = col; fx.beginPath(); fx.arc(gx, gy, 7, 0, 7); fx.fill();
        if (ball.kind === 'hit' && ball.dist >= FENCE(ball.spray) && Math.abs(ball.spray) <= 45 && ball.la >= 15) {
          const pulse = (performance.now() - ball.t0 - ball.dur) / 600;
          if (pulse < 1) { fx.strokeStyle = `rgba(61,220,132,${1 - pulse})`; fx.lineWidth = 3;
            fx.beginPath(); fx.arc(gx, gy, 10 + pulse*30, 0, 7); fx.stroke(); }
        }
      }
    }
    requestAnimationFrame(fieldLoop);
  }

  setInterval(() => { $('hz').textContent = rateEMA ? Math.round(rateEMA) : '–'; }, 500);

  render(); drawField(null); drawView(); fieldLoop();
  if (G.over) { setMsg('Last game finished'); setSub(`${G.runs} runs. Tap a start button for a new game.`); }
  else if (G.inning > 1 || G.outs || G.runs) setSub('Game in progress — tap a start button to continue.');
  window.__bb = { holding: () => holding, sfx: SFX, G: () => G, S: () => S, phase: () => phase, pitch: () => pitch, resolveSwing, classifyHit };   // handy for testing
})();
</script>
</body>
</html>
